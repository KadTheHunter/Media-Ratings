  - title: Spider-Man
    rating: "8.9"
    review: |
      I've always seen the memes that originated from this original Spider-Man movie, but nothing could have prepared me for how good it actually was.
      
      Maybe it's just relative to modern Spider-Man media, but this movie is (to me) Spider-Man made perfect. Everything from his love for MJ, to his spider-suit, to his often awkwardly goofy but ultimately lovable lines- it all ties together to make THE Spider-Man.
      
      Unfortunately due to my own bias against superhero media, I can't bring myself to put it in S tier, but despite that I'm putting it as close as I possibly can, at the very top of A tier (8.9).
      
      <small><em>
      Spider-Man: You know who I am.
      MJ: I do?
      Spider-Man: Your friendly neighborhood Spider-Man! *jumps off the edge*
      </em></small>
    poster: assets/posters/movies/Spider-Man.webp
    tier: a
    watched: "2026-07-13"

  - title: Spider-Man 2
    rating: "8.6"
    review: |
      I didn't enjoy Spider-Man 2 as much as I did the first one, but it was still a serviceable entry in the trilogy.
      
      Not much to say really, it was pretty good. Expanded on the first and wrapped up some leftovers too.
    poster: assets/posters/movies/Spider-Man_2.webp
    tier: a
    watched: "2026-07-17"

  - title: Spider-Man 3
    rating: "8.1"
    review: |
      Honestly, relative to the first two, Spider-Man 3 kinda sucked.
      
      Maybe it's because I watched three Spider-Man movies in less than a week, but this one just didn't have the appeal of the other two, and while I liked the symbiote subplot, the story as a whole felt more disjointed than the first two.
    poster: assets/posters/movies/Spider-Man_3.webp
    tier: a
    watched: "2026-07-18"

