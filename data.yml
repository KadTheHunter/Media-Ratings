  - title: MobLand
    rating: "7.3"
    review: |
      MobLand started out so boring I almost gave it up after the first episode; Its one saving grace was the main character Harry Da Souza (Tom Hardy), who initially seemed to be the only intelligent criminal in the entire show.
      
      Ten episodes later, and that assessment isn't too far off the mark: most of the Harrigan crime family are stark raving lunatics, either naturally or by their families making, and other players like Richie Stevenson think themselves smart but they aren't.
      
      It picks up a bit in later episodes, and is at least tolerable to watch if not completely enjoyable. Was quite surprised by the ending, and am interested to see where Season 2 goes; Will have to update my review when it's out.
      
      Probably the best bit from this show is one of Maeve's lines, which was hilarious and I will <b>absolutely</b> be using as a gamertag in the future: <i>Lord Squire Sir Conrad of Cuntfordshire</i>
