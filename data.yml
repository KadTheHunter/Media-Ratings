  - title: Hogwarts Legacy
    rating: "9.5"
    review: |
      Hogwarts Legacy has earned itself a shockingly high "9.5/10", for being the single best Harry Potter videogame we've had since LEGO Harry Potter: Years 1-4.
      
      I'm aware of all the (valid) criticisms of Hogwarts Legacy, saying that it's just a cookie-cutter RPG with Harry Potter elements sprinkled in, and while I can't and won't deny that's true, I also refuse to rate it lower just because of that.
      
      I havent had so much fun playing an RPG in a long time. Exploring the map was actually addicting and not just a chore. Fast travel made sense because it used The Floo Network (although I will never forget the incessant quips of Ignatia Wildsmith...). Every little village and hamlet felt alive, <i>despite</i> the fact that many buildings and interiors were copy-pasted. And Hogwarts! Oh good god Hogwarts. Exploring the castle was everything I could have hoped for and more. While I wouldn't have complained if it was bigger, it's certainly more detailed and expansive than I ever thought it would be, and genuinely feels like you're traversing the halls of Hogwarts, from the The Great Hall with its rows of benches and floating candles, to the different houses common rooms, the dungeons, astronomy tower, library. Even the exterior and grounds feel perfect.
      
      As for the combat and magic, it's quite intuitive and very fun once you learn the (admittedly simple) controls. It may not be super realistic relative to the Wizard World universe, seeing as a brand new 5th year student is using advanced curses and Dark Magic halfway through the year, but it is fun.
      
      Half a point taken off for shoe-horning in a transgender barkeep, and a lesbian Archaelogist/Historian, as well as the generally odd level of diversity for 1800s Scotland, though I am completely willing to overlook all of those things and hand-wave it away with various in-universe explanations.
      
      Overall one of the best modern RPGs I've ever played, and I sincerely hope we get an expansion for it, or even Hogwarts Legacy 2!
    poster: assets/posters/videogames/Hogwarts_Legacy.webp
    tier: s
    tags:
      - RPG
      - Magic

