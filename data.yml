  - title: Apex Legends
    rating: "5.1"
    review: |
      Apex Legends used to be my absolute favorite multi-player game. 
      
      It had great gunplay, excellent movement, fun abilities, even halfway decent performance.
      
      Sadly, as time ticked onward, Apex lost all of those things one-by-one. 
      Servers became some of the worst in the industry, and were rightfully mocked. 
      New Legends invariably had abilities that were either ridiculously over-powered, or else an insanely boring rework of an older Legends abilities. 
      Old Legends were left to rot, their abilities becoming outdated or worse yet actively detrimental to your squads chances of surviving, forget winning. 
      Movement became increasingly unbalanced, with fun tech like Punch Boosting being patched out of the game, but genuinely game-ruining tech left untouched out of fear of sharp-tongued "pros". 
      Even the gunplay got worse, if somewhat indirectly, by way of changes to shields and armor.
      
      If it was 2022, and Apex Legends was on Season 7, I would score it S-Tier 9.2/10 <i>minimum</i>, but unfortunately that is not so.
      
      I'll never forget the more than 2.5k hours I have in Apex Legends across Steam and PlayStation, nor will I forget some of the best matches I ever played, and teammates I ever met. I'll always love Octane and Loba, and hell even Alter. I'll cherish my rare Arachnoid Rush skin for Octane, and that time I finally got 4,000 damage and 20 kills in a single match.
      
      RIP Apex Legends. You may still be running, but you're no longer the game I loved.
    poster: assets/posters/videogames/Apex_Legends.webp
    tier: b
    tags:
      - FPS
      - Battle Royale
      - Multiplayer

